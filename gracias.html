<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llamada agendada | PLaiT</title>
  <meta name="description" content="Confirmación de agendamiento para videollamada con PLaiT.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .gracias-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: var(--papel);
    }
    .gracias-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 20px;
    }
    .gracias-card {
      background-color: var(--papel-2);
      border: 1px solid var(--borde-suave);
      border-radius: 12px;
      padding: 48px 36px;
      max-width: 580px;
      width: 100%;
      text-align: center;
    }
    .gracias-card h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: var(--tinta);
    }
    .gracias-card p {
      font-size: 19px;
      line-height: 1.6;
      color: var(--tinta-2);
      margin-bottom: 32px;
    }
    .gracias-card .btn-cta {
      width: auto;
      padding: 0 36px;
    }
  </style>
</head>
<body class="gracias-page">

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="/" aria-label="PLaiT inicio">
          <img src="assets/images/plait-logo.jpg" alt="PLaiT" width="138" height="44" class="brand-logo">
        </a>
      </div>
    </div>
  </header>

  <main class="gracias-main">
    <div class="gracias-card">
      <h1>Llamada agendada.</h1>
      <p>Te va a llegar la invitación por correo. El día de la llamada te escribimos por WhatsApp media hora antes.</p>
      <a href="/" class="btn-cta">Volver al inicio</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-legal">
        <p>© 2026 PLaiT · <a href="/privacidad">Política de privacidad</a></p>
      </div>
    </div>
  </footer>

</body>
</html>
