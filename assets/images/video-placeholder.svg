<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090e1a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Subtle Tech Grid Lines -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="213" y1="0" x2="213" y2="720"/>
    <line x1="426" y1="0" x2="426" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="853" y1="0" x2="853" y2="720"/>
    <line x1="1066" y1="0" x2="1066" y2="720"/>
  </g>

  <!-- Central Chat Mockup Card -->
  <rect x="290" y="70" width="700" height="580" rx="24" fill="#0b1326" stroke="#1e293b" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Mockup Top Bar (WhatsApp Style Header) -->
  <path d="M290 94 C290 80.7 300.7 70 314 70 H966 C979.3 70 990 80.7 990 94 V140 H290 Z" fill="#111c38"/>
  
  <!-- Avatar & Online Badge -->
  <circle cx="340" cy="105" r="20" fill="#1e293b"/>
  <circle cx="340" cy="105" r="18" fill="#2563eb" opacity="0.3"/>
  <text x="340" y="111" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PL</text>
  <circle cx="355" cy="120" r="5" fill="#10b981" stroke="#111c38" stroke-width="2"/>
  
  <text x="375" y="103" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Secretaria Virtual PLaiT</text>
  <text x="375" y="122" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">En línea · Responde en 15 seg</text>

  <!-- Incoming Message (Client at 3:14 AM) -->
  <g transform="translate(320, 175)">
    <rect width="440" height="74" rx="14" fill="#1e293b"/>
    <text x="20" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Hola, buenas noches. ¿Tienen turnos disponibles</text>
    <text x="20" y="54" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">para corte y barba este jueves a las 18 hs?</text>
    <text x="385" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">03:14 AM</text>
  </g>

  <!-- Outgoing Message (AI Secretary reply at 3:14 AM - 20 seconds later) -->
  <g transform="translate(480, 275)">
    <rect width="480" height="135" rx="14" fill="#044e54" stroke="#0d9488" stroke-width="1"/>
    <text x="20" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">¡Hola! Sí, el jueves a las 18:00 hs tenemos lugar</text>
    <text x="20" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">con Franco. El servicio completo es de $8.500.</text>
    <text x="20" y="85" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">¿Te gustaría que te reserve ese horario ahora mismo?</text>
    <text x="400" y="120" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">03:14 AM ✓✓</text>
  </g>

  <!-- Client confirmation -->
  <g transform="translate(320, 435)">
    <rect width="320" height="50" rx="14" fill="#1e293b"/>
    <text x="20" y="31" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">¡Excelente! Por favor resérvalo a mi nombre.</text>
    <text x="265" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">03:15 AM</text>
  </g>

  <!-- AI final booking confirmation -->
  <g transform="translate(520, 505)">
    <rect width="440" height="60" rx="14" fill="#044e54" stroke="#0d9488" stroke-width="1"/>
    <text x="20" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">✅ ¡Turno agendado con éxito! Te dejamos anotado.</text>
    <text x="20" y="48" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Te enviaremos un recordatorio 2 horas antes.</text>
    <text x="360" y="48" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">03:15 AM ✓✓</text>
  </g>

  <!-- Dark Overlay to make Play Button pop -->
  <rect width="1280" height="720" fill="#070d1e" opacity="0.45"/>

  <!-- Centered Interactive Play Button Icon -->
  <g transform="translate(640, 360)">
    <circle r="52" fill="#0284c7" filter="url(#glowEffect)"/>
    <circle r="46" fill="url(#btnGrad)"/>
    <polygon points="-10,-18 20,0 -10,18" fill="#ffffff"/>
  </g>

  <!-- Bottom CTA hint -->
  <text x="640" y="450" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" text-anchor="middle" filter="url(#glowEffect)">
    Haz clic para ver la demo en video (60 seg)
  </text>
  <text x="640" y="478" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">
    Atención real, sin respuestas genéricas ni demoras
  </text>
</svg>
