<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="60%" stop-color="#0d111c"/>
      <stop offset="100%" stop-color="#0a1526"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131826"/>
      <stop offset="100%" stop-color="#0d111c"/>
    </linearGradient>
    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle glow shapes -->
  <circle cx="200" cy="150" r="300" fill="#0284c7" opacity="0.12" filter="blur(90px)"/>
  <circle cx="1000" cy="480" r="280" fill="#10b981" opacity="0.1" filter="blur(100px)"/>

  <!-- Brand Logotype Header -->
  <g transform="translate(100, 80)">
    <rect width="130" height="44" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="26" cy="22" r="6" fill="#10b981"/>
    <text x="44" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="1">PLaiT</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="200" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" line-height="1.2">
    Tu negocio contesta en 30 segundos,
  </text>
  <text x="100" y="265" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800">
    aunque sean las 3 de la mañana.
  </text>

  <!-- Subtitle -->
  <text x="100" y="340" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Secretaria virtual con IA para WhatsApp y redes sociales.
  </text>
  <text x="100" y="375" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Atiende consultas, brinda precios y horarios, y agenda citas 24/7.
  </text>

  <!-- Badges at bottom -->
  <g transform="translate(100, 460)">
    <!-- Badge 1 -->
    <rect width="280" height="60" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="37" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">⚡ Atención continua 24/7</text>

    <!-- Badge 2 -->
    <rect x="305" width="290" height="60" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="325" y="37" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">📅 Agenda turnos automática</text>

    <!-- Badge 3 -->
    <rect x="620" width="280" height="60" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="642" y="37" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🚀 Lista en 48 a 72 horas</text>
  </g>
</svg>
